<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Democracia Directa Argentina</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Sistema Democracia Directa Argentina</h1>
            <p class="subtitle">(Versión beta, no ingresar datos reales, la versión final autenticará usando MiArgentina)</p>
        </div>

        <!-- Warning Message -->
        <div class="warning-banner">
            <span class="warning-icon">⚠️</span>
            <strong>Esta es una versión de prueba, no ingresar datos reales</strong>
        </div>

        <div class="auth-container">
            <div class="tabs">
                <button class="tab-button active" onclick="showTab('login')">Iniciar Sesión</button>
                <button class="tab-button" onclick="showTab('register')">Registrarse</button>
            </div>

            <!-- Login Form -->
            <div id="login-form" class="form-container active">
                <h2>Iniciar Sesión</h2>
                <form onsubmit="return handleLogin(event)">
                    <div class="form-group">
                        <label for="login-email">Correo Electrónico</label>
                        <input type="email" id="login-email" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Contraseña</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Ingresar</button>
                </form>
                <div id="login-message" class="message"></div>
            </div>

            <!-- Register Form -->
            <div id="register-form" class="form-container">
                <h2>Crear Cuenta</h2>
                <form onsubmit="return handleRegister(event)">
                    <div class="form-group">
                        <label for="reg-nombre">Nombre</label>
                        <input type="text" id="reg-nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-apellido">Apellido</label>
                        <input type="text" id="reg-apellido" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-email">Correo Electrónico</label>
                        <input type="email" id="reg-email" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Contraseña</label>
                        <input type="password" id="reg-password" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="reg-password-confirm">Confirmar Contraseña</label>
                        <input type="password" id="reg-password-confirm" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary">Registrarse</button>
                </form>
                <div id="register-message" class="message"></div>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
